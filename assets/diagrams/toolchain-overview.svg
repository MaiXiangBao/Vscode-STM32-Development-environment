<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">STM32 开发工具链总览</title>
  <desc id="desc">CubeMX 生成代码，CMake 和 GCC 构建固件，OpenOCD 通过 ST-Link 调试目标芯片。</desc>
  <rect width="1500" height="760" fill="#f8fafc"/>
  <text x="70" y="72" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="800">一条主线，五个角色</text>
  <text x="72" y="110" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="20">每个工具只负责一件事，VS Code 负责把操作串起来。</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <rect x="72" y="174" width="238" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="98" y="216" fill="#1e3a8a" font-size="26" font-weight="800">STM32CubeMX</text>
    <text x="98" y="254" fill="#334155" font-size="19">选芯片、配引脚、配时钟</text>
    <text x="98" y="286" fill="#334155" font-size="19">生成初始化代码</text>

    <path d="M324 249h74" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="412" y="174" width="238" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="438" y="216" fill="#14532d" font-size="26" font-weight="800">C 源码</text>
    <text x="438" y="254" fill="#334155" font-size="19">Core、HAL、启动文件</text>
    <text x="438" y="286" fill="#334155" font-size="19">链接脚本与头文件</text>

    <path d="M664 249h74" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="752" y="174" width="238" height="150" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="778" y="216" fill="#7c2d12" font-size="26" font-weight="800">CMake + GCC</text>
    <text x="778" y="254" fill="#334155" font-size="19">配置、编译、链接</text>
    <text x="778" y="286" fill="#334155" font-size="19">生成 ELF / HEX / BIN</text>

    <path d="M1004 249h74" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1092" y="174" width="238" height="150" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="1118" y="216" fill="#581c87" font-size="26" font-weight="800">OpenOCD</text>
    <text x="1118" y="254" fill="#334155" font-size="19">GDB Server、烧录</text>
    <text x="1118" y="286" fill="#334155" font-size="19">复位、运行、断点</text>

    <path d="M1211 324v276h-531v-40" fill="none" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="442" y="410" width="238" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="468" y="452" fill="#7f1d1d" font-size="26" font-weight="800">ST-Link V2</text>
    <text x="468" y="490" fill="#334155" font-size="19">USB ↔ SWD 协议转换</text>
    <text x="468" y="522" fill="#334155" font-size="19">供电、下载、调试</text>

    <path d="M694 485h76" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="784" y="410" width="238" height="150" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="810" y="452" fill="#0f172a" font-size="26" font-weight="800">STM32 芯片</text>
    <text x="810" y="490" fill="#334155" font-size="19">Flash 运行固件</text>
    <text x="810" y="522" fill="#334155" font-size="19">CPU 暂停、单步、观察</text>

    <rect x="72" y="620" width="1258" height="86" rx="14" fill="#0f172a"/>
    <text x="98" y="654" fill="#5eead4" font-size="20" font-weight="800">VS Code</text>
    <text x="218" y="654" fill="#e2e8f0" font-size="20">负责编辑代码、调用 CMake、启动 OpenOCD、查看变量和调用栈</text>
    <text x="98" y="685" fill="#cbd5e1" font-size="17">它不是编译器，也不是下载器，而是统一的前端工作台。</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
