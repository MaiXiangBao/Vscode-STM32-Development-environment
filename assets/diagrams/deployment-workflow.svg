<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">部署流程</title>
  <desc id="desc">从安装工具到调试固件的八步流程。</desc>
  <rect width="1500" height="820" fill="#f9fafb"/>
  <text x="70" y="72" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="800">建议按这个顺序完成，不要跳步</text>
  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(70 130)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#0f766e"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">1</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">安装五个基础工具</text>
      <text x="92" y="78" fill="#64748b" font-size="17">CubeMX / GCC / CMake</text>
      <text x="92" y="102" fill="#64748b" font-size="17">OpenOCD / VS Code</text>
    </g>
    <g transform="translate(430 130)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#2563eb"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">2</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">检查 PATH</text>
      <text x="92" y="80" fill="#64748b" font-size="17">在 PowerShell 中逐项验证版本</text>
    </g>
    <g transform="translate(790 130)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#7c3aed"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">3</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">CubeMX 新建工程</text>
      <text x="92" y="80" fill="#64748b" font-size="17">芯片、时钟、SWD、GPIO</text>
    </g>
    <g transform="translate(1150 130)">
      <rect width="280" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#ea580c"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">4</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">生成 CMake 工程</text>
      <text x="92" y="80" fill="#64748b" font-size="17">保留 .ioc 与用户代码区</text>
    </g>

    <path d="M380 188h42M740 188h42M1100 188h42" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow2)"/>
    <path d="M1290 246v120H225v64" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
    <g transform="translate(70 430)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#dc2626"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">5</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">复制 VS Code 配置</text>
      <text x="92" y="78" fill="#64748b" font-size="17">.vscode / presets</text>
      <text x="92" y="102" fill="#64748b" font-size="17">OpenOCD cfg</text>
    </g>
    <g transform="translate(430 430)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#0891b2"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">6</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">CMake 配置与构建</text>
      <text x="92" y="80" fill="#64748b" font-size="17">生成 build/Debug/*.elf</text>
    </g>
    <g transform="translate(790 430)">
      <rect width="310" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#16a34a"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">7</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">连接 ST-Link</text>
      <text x="92" y="78" fill="#64748b" font-size="17">SWDIO / SWCLK</text>
      <text x="92" y="102" fill="#64748b" font-size="17">GND / 3V3</text>
    </g>
    <g transform="translate(1150 430)">
      <rect width="280" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="58" r="25" fill="#4f46e5"/><text x="50" y="66" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">8</text>
      <text x="92" y="48" fill="#0f172a" font-size="22" font-weight="800">烧录并调试</text>
      <text x="92" y="80" fill="#64748b" font-size="17">F5、断点、变量、寄存器</text>
    </g>
    <path d="M380 488h42M740 488h42M1100 488h42" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow2)"/>

    <rect x="70" y="634" width="1360" height="112" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="98" y="674" fill="#065f46" font-size="22" font-weight="800">每一步都要能单独验证</text>
    <text x="98" y="710" fill="#334155" font-size="18">版本命令能运行 → CubeMX 能生成 → CMake 能构建 → OpenOCD 能连接 → VS Code 能断点。</text>
  </g>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
