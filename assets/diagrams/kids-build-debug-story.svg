<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">程序从电脑到芯片的故事</title>
  <desc id="desc">用简单故事说明源码、CMake、GCC、OpenOCD、ST-Link 和芯片之间的关系。</desc>
  <rect width="1500" height="820" fill="#f8fafc"/>
  <text x="66" y="68" fill="#111827" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="800">程序从电脑走到芯片，中间发生了什么</text>
  <text x="68" y="108" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="20">把这张图看懂，五个工具的关系就懂了。</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(60 170)">
      <rect width="220" height="220" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="110" y="58" text-anchor="middle" fill="#1e3a8a" font-size="24" font-weight="800">你写的 C 代码</text>
      <path d="M45 92h130M45 124h112M45 156h96" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
      <text x="110" y="198" text-anchor="middle" fill="#475569" font-size="17">就像写作文</text>
    </g>
    <path d="M290 280h60" stroke="#94a3b8" stroke-width="3" marker-end="url(#kids-arrow3)"/>
    <g transform="translate(360 170)">
      <rect width="220" height="220" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
      <text x="110" y="58" text-anchor="middle" fill="#7c2d12" font-size="24" font-weight="800">CMake 排顺序</text>
      <circle cx="110" cy="122" r="42" fill="#fff" stroke="#ea580c" stroke-width="5"/>
      <text x="110" y="134" text-anchor="middle" fill="#7c2d12" font-size="35" font-weight="800">1 2 3</text>
      <text x="110" y="198" text-anchor="middle" fill="#475569" font-size="17">就像做菜步骤</text>
    </g>
    <path d="M590 280h60" stroke="#94a3b8" stroke-width="3" marker-end="url(#kids-arrow3)"/>
    <g transform="translate(660 170)">
      <rect width="220" height="220" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="110" y="58" text-anchor="middle" fill="#14532d" font-size="24" font-weight="800">GCC 来翻译</text>
      <text x="68" y="132" fill="#16a34a" font-size="55" font-weight="800">C</text>
      <path d="M112 116h36" stroke="#16a34a" stroke-width="4" marker-end="url(#kids-arrow3)"/>
      <text x="158" y="136" fill="#14532d" font-size="27" font-weight="800">机器码</text>
      <text x="110" y="198" text-anchor="middle" fill="#475569" font-size="17">就像翻译语言</text>
    </g>
    <path d="M890 280h60" stroke="#94a3b8" stroke-width="3" marker-end="url(#kids-arrow3)"/>
    <g transform="translate(960 170)">
      <rect width="220" height="220" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
      <text x="110" y="58" text-anchor="middle" fill="#581c87" font-size="24" font-weight="800">打包成 ELF</text>
      <rect x="50" y="94" width="120" height="74" rx="10" fill="#fff" stroke="#9333ea" stroke-width="4"/>
      <text x="110" y="140" text-anchor="middle" fill="#581c87" font-size="25" font-weight="800">.elf</text>
      <text x="110" y="198" text-anchor="middle" fill="#475569" font-size="17">就像装进盒子</text>
    </g>
    <path d="M1190 280h60" stroke="#94a3b8" stroke-width="3" marker-end="url(#kids-arrow3)"/>
    <g transform="translate(1260 170)">
      <rect width="180" height="220" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="90" y="58" text-anchor="middle" fill="#7f1d1d" font-size="24" font-weight="800">送到芯片</text>
      <text x="90" y="116" text-anchor="middle" fill="#334155" font-size="18">OpenOCD</text>
      <polygon points="82,132 98,132 90,148" fill="#dc2626"/>
      <text x="90" y="184" text-anchor="middle" fill="#334155" font-size="18">ST-Link</text>
      <polygon points="82,196 98,196 90,212" fill="#dc2626"/>
      <text x="90" y="238" text-anchor="middle" fill="#7f1d1d" font-size="20" font-weight="800">STM32</text>
    </g>

    <rect x="60" y="480" width="1380" height="250" rx="20" fill="#111827"/>
    <text x="100" y="530" fill="#5eead4" font-size="27" font-weight="800">最容易记错的一句话</text>
    <text x="100" y="580" fill="#e2e8f0" font-size="22">VS Code 不负责编译，它只是按钮和窗口。</text>
    <text x="100" y="620" fill="#e2e8f0" font-size="22">真正编译的是 GCC，安排顺序的是 CMake。</text>
    <text x="100" y="660" fill="#e2e8f0" font-size="22">真正连接芯片的是 OpenOCD + ST-Link。</text>
    <text x="100" y="700" fill="#fbbf24" font-size="20" font-weight="700">调试时要用 .elf，因为它保存了函数名、变量名和行号。</text>
  </g>
  <defs>
    <marker id="kids-arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
