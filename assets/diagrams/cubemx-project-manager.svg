<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="820" viewBox="0 0 1460 820" role="img" aria-labelledby="title desc">
  <title id="title">STM32CubeMX Project Manager 关键设置示意</title>
  <desc id="desc">Project、Code Generator 和 Toolchain IDE 的设置位置示意。</desc>
  <rect width="1460" height="820" fill="#eef2f7"/>
  <text x="54" y="54" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="800">CubeMX Project Manager 关键设置示意</text>
  <text x="56" y="86" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18">不同版本控件位置可能变化，以关键词为准。</text>

  <rect x="44" y="116" width="1372" height="640" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="44" y="116" width="1372" height="48" rx="10" fill="#334155"/>
  <text x="70" y="148" fill="#ffffff" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700">STM32CubeMX - Project Manager</text>
  <rect x="44" y="164" width="250" height="592" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18" fill="#334155">
    <text x="76" y="208" fill="#0f766e" font-weight="800">Project</text>
    <text x="76" y="252">Project</text>
    <text x="76" y="296">Code Generator</text>
    <text x="76" y="340">Advanced Settings</text>
    <text x="76" y="384">Clock Configuration</text>
  </g>

  <rect x="330" y="194" width="1030" height="214" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="234" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="800">Project</text>
  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18" fill="#334155">
    <text x="360" y="278">Project Name:</text>
    <rect x="520" y="254" width="330" height="36" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="538" y="279" fill="#0f172a">stm32f103c8t6-blink</text>
    <text x="360" y="326">Project Location:</text>
    <rect x="520" y="302" width="760" height="36" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="538" y="327" fill="#0f172a">C:\STM32\Projects</text>
    <text x="360" y="374">Toolchain / IDE:</text>
    <rect x="520" y="350" width="230" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="538" y="375" fill="#065f46" font-weight="800">CMake</text>
    <text x="774" y="375" fill="#b91c1c">没有 CMake 时改选 Makefile，再走手工 CMake</text>
  </g>

  <rect x="330" y="438" width="1030" height="274" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="478" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="800">Code Generator</text>
  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18" fill="#334155">
    <rect x="360" y="510" width="24" height="24" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <path d="M365 522l6 6 12-15" fill="none" stroke="#0f766e" stroke-width="4"/>
    <text x="400" y="530">Copy only the necessary library files</text>

    <rect x="360" y="558" width="24" height="24" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <path d="M365 570l6 6 12-15" fill="none" stroke="#0f766e" stroke-width="4"/>
    <text x="400" y="578">Generate peripheral initialization as a pair of .c/.h files</text>

    <rect x="360" y="606" width="24" height="24" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <path d="M365 618l6 6 12-15" fill="none" stroke="#0f766e" stroke-width="4"/>
    <text x="400" y="626">Keep User Code when re-generating</text>

    <text x="360" y="682" fill="#b91c1c" font-weight="700">用户代码必须放在 USER CODE BEGIN / END 之间。</text>
  </g>

  <rect x="48" y="774" width="1364" height="28" rx="6" fill="#0f766e"/>
  <text x="64" y="794" fill="#ffffff" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="15">Project Name + Location + CMake + Code Generator 是首次生成前最关键的检查项。</text>
</svg>
