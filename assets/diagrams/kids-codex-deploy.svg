<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">使用 Codex 快速部署环境</title>
  <desc id="desc">打开仓库、复制提示词、让 Codex 自动安装工具并检查结果。</desc>
  <rect width="1500" height="820" fill="#f8fafc"/>
  <text x="64" y="68" fill="#111827" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="800">Codex 一键部署，只需要说一句话</text>
  <text x="66" y="108" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="20">VS Code 和 STM32CubeMX 自己安装，其余交给 Codex。</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(70 170)">
      <rect width="300" height="250" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <circle cx="60" cy="60" r="30" fill="#2563eb"/>
      <text x="60" y="69" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">1</text>
      <text x="108" y="54" fill="#1e3a8a" font-size="24" font-weight="800">打开项目</text>
      <text x="108" y="84" fill="#334155" font-size="18">让 Codex 打开</text>
      <text x="108" y="112" fill="#334155" font-size="18">VScode-STM32- 仓库</text>
      <rect x="42" y="152" width="216" height="58" rx="10" fill="#fff" stroke="#94a3b8"/>
      <text x="150" y="188" text-anchor="middle" fill="#0f172a" font-size="18">不需要先安装工具</text>
    </g>
    <path d="M384 295h72" stroke="#94a3b8" stroke-width="6" marker-end="url(#kids-arrow)"/>
    <g transform="translate(470 170)">
      <rect width="300" height="250" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <circle cx="60" cy="60" r="30" fill="#16a34a"/>
      <text x="60" y="69" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text>
      <text x="108" y="54" fill="#14532d" font-size="24" font-weight="800">复制一句话</text>
      <text x="42" y="104" fill="#334155" font-size="17">请你读取</text>
      <text x="42" y="132" fill="#334155" font-size="17">CODEX-DEPLOY-PROMPT.txt</text>
      <text x="42" y="160" fill="#334155" font-size="17">并严格按里面的步骤</text>
      <text x="42" y="188" fill="#334155" font-size="17">帮我部署 STM32。</text>
      <rect x="42" y="212" width="216" height="20" rx="5" fill="#86efac"/>
    </g>
    <path d="M784 295h72" stroke="#94a3b8" stroke-width="6" marker-end="url(#kids-arrow)"/>
    <g transform="translate(870 170)">
      <rect width="300" height="250" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
      <circle cx="60" cy="60" r="30" fill="#ea580c"/>
      <text x="60" y="69" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">3</text>
      <text x="108" y="54" fill="#7c2d12" font-size="24" font-weight="800">Codex 自动做</text>
      <text x="42" y="106" fill="#334155" font-size="18">用 winget 安装工具</text>
      <text x="42" y="142" fill="#334155" font-size="18">检查 PATH</text>
      <text x="42" y="178" fill="#334155" font-size="18">检查版本</text>
      <text x="42" y="214" fill="#334155" font-size="18">安装 VS Code 扩展</text>
    </g>
    <path d="M1184 295h72" stroke="#94a3b8" stroke-width="6" marker-end="url(#kids-arrow)"/>
    <g transform="translate(1270 170)">
      <rect width="160" height="250" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
      <circle cx="80" cy="60" r="30" fill="#10b981"/>
      <text x="80" y="69" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">4</text>
      <text x="80" y="116" text-anchor="middle" fill="#065f46" font-size="24" font-weight="800">完成</text>
      <path d="M45 160l25 25 48-58" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="222" text-anchor="middle" fill="#334155" font-size="16">可以开始</text>
      <text x="80" y="244" text-anchor="middle" fill="#334155" font-size="16">建工程</text>
    </g>

    <rect x="70" y="510" width="1360" height="210" rx="20" fill="#111827"/>
    <text x="105" y="560" fill="#5eead4" font-size="26" font-weight="800">要复制的固定提示词</text>
    <text x="105" y="610" fill="#e2e8f0" font-size="21">请你读取 CODEX-DEPLOY-PROMPT.txt，</text>
    <text x="105" y="650" fill="#e2e8f0" font-size="21">并严格按照里面的步骤帮我部署 STM32 环境。</text>
    <text x="105" y="694" fill="#94a3b8" font-size="18">Codex 会检查每一步，遇到必须手动点击的地方会告诉你。</text>
  </g>
  <defs>
    <marker id="kids-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
