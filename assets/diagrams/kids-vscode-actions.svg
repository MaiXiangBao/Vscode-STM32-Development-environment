<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">VS Code 新手四个动作</title>
  <desc id="desc">打开文件夹、安装扩展、运行任务、按 F5 调试。</desc>
  <rect width="1500" height="900" fill="#eef2f7"/>
  <text x="64" y="66" fill="#111827" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="800">VS Code 只学四个动作</text>
  <text x="66" y="106" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="20">先会打开、装扩展、构建、调试，其他按钮以后再学。</text>

  <rect x="64" y="154" width="1372" height="640" rx="20" fill="#1f2430"/>
  <rect x="64" y="154" width="1372" height="52" rx="20" fill="#334155"/>
  <circle cx="102" cy="180" r="8" fill="#ef4444"/><circle cx="130" cy="180" r="8" fill="#f59e0b"/><circle cx="158" cy="180" r="8" fill="#22c55e"/>
  <text x="750" y="186" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18">VS Code 新手操作区</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(104 240)">
      <rect width="310" height="220" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <circle cx="52" cy="48" r="27" fill="#2563eb"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text>
      <text x="94" y="48" fill="#1e3a8a" font-size="24" font-weight="800">打开文件夹</text>
      <text x="94" y="78" fill="#334155" font-size="17">File → Open Folder</text>
      <rect x="50" y="112" width="210" height="48" rx="8" fill="#fff" stroke="#60a5fa"/>
      <text x="155" y="143" text-anchor="middle" fill="#1e3a8a" font-size="18">选择工程根目录</text>
      <text x="50" y="194" fill="#475569" font-size="16">不是只打开 main.c。</text>
    </g>
    <g transform="translate(444 240)">
      <rect width="310" height="220" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <circle cx="52" cy="48" r="27" fill="#16a34a"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
      <text x="94" y="48" fill="#14532d" font-size="24" font-weight="800">安装扩展</text>
      <text x="94" y="78" fill="#334155" font-size="17">Ctrl+Shift+X</text>
      <rect x="50" y="112" width="210" height="48" rx="8" fill="#fff" stroke="#4ade80"/>
      <text x="155" y="143" text-anchor="middle" fill="#14532d" font-size="17">搜索 Cortex-Debug</text>
      <text x="50" y="194" fill="#475569" font-size="16">再安装 CMake Tools。</text>
    </g>
    <g transform="translate(784 240)">
      <rect width="310" height="220" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
      <circle cx="52" cy="48" r="27" fill="#ea580c"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
      <text x="94" y="48" fill="#7c2d12" font-size="24" font-weight="800">运行构建</text>
      <text x="94" y="78" fill="#334155" font-size="17">Ctrl+Shift+P</text>
      <rect x="50" y="112" width="210" height="48" rx="8" fill="#fff" stroke="#fb923c"/>
      <text x="155" y="143" text-anchor="middle" fill="#7c2d12" font-size="17">Tasks: Run Task</text>
      <text x="50" y="194" fill="#475569" font-size="16">选择 CMake build。</text>
    </g>
    <g transform="translate(1124 240)">
      <rect width="280" height="220" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
      <circle cx="52" cy="48" r="27" fill="#9333ea"/><text x="52" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text>
      <text x="94" y="48" fill="#581c87" font-size="24" font-weight="800">开始调试</text>
      <rect x="50" y="98" width="180" height="66" rx="12" fill="#fff" stroke="#a855f7"/>
      <text x="140" y="142" text-anchor="middle" fill="#581c87" font-size="34" font-weight="800">F5</text>
      <text x="50" y="202" fill="#475569" font-size="16">停下时看变量。</text>
    </g>

    <rect x="104" y="520" width="1300" height="220" rx="16" fill="#111827"/>
    <text x="140" y="568" fill="#5eead4" font-size="25" font-weight="800">完成时你应该看到</text>
    <text x="140" y="616" fill="#e2e8f0" font-size="20">1. 左侧文件列表里有 Core、Drivers、CMakeLists.txt。</text>
    <text x="140" y="654" fill="#e2e8f0" font-size="20">2. 终端最后出现 Linking C executable 和 .elf。</text>
    <text x="140" y="692" fill="#e2e8f0" font-size="20">3. 按 F5 后，左侧出现 VARIABLES、CALL STACK、BREAKPOINTS。</text>
    <text x="140" y="730" fill="#fbbf24" font-size="19" font-weight="800">红色波浪线不一定代表不能编译，先看终端真正的 error。</text>
  </g>
</svg>
