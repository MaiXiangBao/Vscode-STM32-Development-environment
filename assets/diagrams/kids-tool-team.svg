<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">STM32 工具小队</title>
  <desc id="desc">用简单比喻说明 CubeMX、GCC、CMake、OpenOCD、VS Code 和 Codex 的工作。</desc>
  <rect width="1500" height="900" fill="#fffaf0"/>
  <text x="70" y="72" fill="#111827" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="38" font-weight="800">先认识五个小帮手</text>
  <text x="72" y="112" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="21">你不用一次记住。只要知道谁负责哪一步。</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <g transform="translate(70 160)">
      <rect width="270" height="270" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <circle cx="70" cy="70" r="34" fill="#2563eb"/>
      <text x="70" y="79" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">1</text>
      <text x="126" y="54" fill="#1e3a8a" font-size="24" font-weight="800">STM32</text>
      <text x="126" y="84" fill="#1e3a8a" font-size="24" font-weight="800">CubeMX</text>
      <text x="126" y="112" fill="#334155" font-size="18">画图纸</text>
      <text x="36" y="158" fill="#334155" font-size="19">你点选芯片、引脚和时钟。</text>
      <text x="36" y="194" fill="#334155" font-size="19">它自动写出工程骨架。</text>
      <text x="36" y="238" fill="#1d4ed8" font-size="18" font-weight="700">你只需要点鼠标</text>
    </g>
    <g transform="translate(365 160)">
      <rect width="270" height="270" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <circle cx="70" cy="70" r="34" fill="#16a34a"/>
      <text x="70" y="79" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">2</text>
      <text x="126" y="64" fill="#14532d" font-size="25" font-weight="800">GCC</text>
      <text x="126" y="96" fill="#334155" font-size="18">翻译官</text>
      <text x="36" y="158" fill="#334155" font-size="19">把 C 语言翻译成</text>
      <text x="36" y="194" fill="#334155" font-size="19">STM32 能懂的机器语言。</text>
      <text x="36" y="238" fill="#15803d" font-size="18" font-weight="700">它负责编译</text>
    </g>
    <g transform="translate(660 160)">
      <rect width="270" height="270" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
      <circle cx="70" cy="70" r="34" fill="#ea580c"/>
      <text x="70" y="79" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">3</text>
      <text x="126" y="64" fill="#7c2d12" font-size="25" font-weight="800">CMake</text>
      <text x="126" y="96" fill="#334155" font-size="18">施工队长</text>
      <text x="36" y="158" fill="#334155" font-size="19">告诉 GCC：先做谁、</text>
      <text x="36" y="194" fill="#334155" font-size="19">再做谁、最后怎么连接。</text>
      <text x="36" y="238" fill="#c2410c" font-size="18" font-weight="700">它负责安排顺序</text>
    </g>
    <g transform="translate(955 160)">
      <rect width="270" height="270" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
      <circle cx="70" cy="70" r="34" fill="#9333ea"/>
      <text x="70" y="79" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">4</text>
      <text x="126" y="64" fill="#581c87" font-size="25" font-weight="800">OpenOCD</text>
      <text x="126" y="96" fill="#334155" font-size="18">搭桥人</text>
      <text x="36" y="158" fill="#334155" font-size="19">把电脑和 ST-Link</text>
      <text x="36" y="194" fill="#334155" font-size="19">连接电脑、下载、调试。</text>
      <text x="36" y="238" fill="#7e22ce" font-size="18" font-weight="700">它负责和芯片说话</text>
    </g>
    <g transform="translate(1250 160)">
      <rect width="180" height="270" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
      <circle cx="90" cy="66" r="34" fill="#0284c7"/>
      <text x="90" y="75" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">5</text>
      <text x="90" y="126" text-anchor="middle" fill="#0c4a6e" font-size="23" font-weight="800">VS Code</text>
      <text x="90" y="160" text-anchor="middle" fill="#334155" font-size="18">总控制台</text>
      <text x="90" y="214" text-anchor="middle" fill="#334155" font-size="17">写代码、点按钮、</text>
      <text x="90" y="242" text-anchor="middle" fill="#334155" font-size="17">看错误、按 F5</text>
      <text x="90" y="276" text-anchor="middle" fill="#0369a1" font-size="17" font-weight="700">你操作的地方</text>
    </g>

    <rect x="70" y="500" width="1360" height="130" rx="20" fill="#111827"/>
    <circle cx="130" cy="565" r="34" fill="#5eead4"/>
    <text x="130" y="575" text-anchor="middle" fill="#083344" font-size="28" font-weight="800">C</text>
    <text x="190" y="548" fill="#ffffff" font-size="27" font-weight="800">Codex 是电脑小老师</text>
    <text x="190" y="588" fill="#cbd5e1" font-size="20">它帮你下载工具、设置 PATH、安装扩展、检查错误，并把难懂的内容翻译成简单话。</text>

    <rect x="70" y="680" width="1360" height="154" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="100" y="726" fill="#065f46" font-size="27" font-weight="800">它们如何接力</text>
    <text x="100" y="774" fill="#334155" font-size="22">CubeMX 画图 → CMake 排队 → GCC 翻译 → OpenOCD 送进芯片 → VS Code 给你看结果</text>
    <text x="100" y="814" fill="#334155" font-size="22">如果哪里出错，把错误原样告诉 Codex，它帮你判断是谁没有做好自己的工作。</text>
  </g>
</svg>
