<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">ST-Link 与 STM32 Blue Pill 的 SWD 接线</title>
  <desc id="desc">SWDIO、SWCLK、GND、3.3V 和可选 NRST 的连接示意。</desc>
  <rect width="1500" height="760" fill="#f8fafc"/>
  <text x="60" y="66" fill="#0f172a" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="800">ST-Link V2 与 STM32F103C8T6 接线示意</text>
  <text x="62" y="104" fill="#64748b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19">目标板由 ST-Link 的 3.3V 供电时，不要再接外部 3.3V / 5V 电源。</text>

  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M180 270H850V270H1090" stroke="#dc2626"/>
    <path d="M180 330H900V330H1090" stroke="#0f172a"/>
    <path d="M180 390H950V390H1090" stroke="#2563eb"/>
    <path d="M180 450H1000V450H1090" stroke="#16a34a"/>
    <path d="M180 510H1050V510H1090" stroke="#7c3aed" stroke-dasharray="14 10"/>
  </g>

  <g font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif">
    <rect x="120" y="180" width="360" height="400" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <rect x="172" y="150" width="256" height="60" rx="12" fill="#334155"/>
    <text x="300" y="188" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">ST-Link V2</text>
    <g font-size="20" font-weight="700">
      <circle cx="180" cy="270" r="9" fill="#dc2626"/><text x="206" y="277" fill="#0f172a">3.3V</text>
      <circle cx="180" cy="330" r="9" fill="#0f172a"/><text x="206" y="337" fill="#0f172a">GND</text>
      <circle cx="180" cy="390" r="9" fill="#2563eb"/><text x="206" y="397" fill="#0f172a">SWDIO</text>
      <circle cx="180" cy="450" r="9" fill="#16a34a"/><text x="206" y="457" fill="#0f172a">SWCLK</text>
      <circle cx="180" cy="510" r="9" fill="#7c3aed"/><text x="206" y="517" fill="#0f172a">RST</text>
    </g>
    <rect x="1020" y="120" width="360" height="520" rx="20" fill="#14532d" stroke="#052e16" stroke-width="3"/>
    <text x="1200" y="172" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">STM32F103C8T6</text>
    <text x="1200" y="206" text-anchor="middle" fill="#bbf7d0" font-size="18">Blue Pill</text>
    <g font-size="19" font-weight="700">
      <circle cx="1090" cy="270" r="9" fill="#dc2626"/><text x="1116" y="277" fill="#fff">3V3</text>
      <circle cx="1090" cy="330" r="9" fill="#0f172a"/><text x="1116" y="337" fill="#fff">GND</text>
      <circle cx="1090" cy="390" r="9" fill="#2563eb"/><text x="1116" y="397" fill="#fff">PA13 / SWDIO</text>
      <circle cx="1090" cy="450" r="9" fill="#16a34a"/><text x="1116" y="457" fill="#fff">PA14 / SWCLK</text>
      <circle cx="1090" cy="510" r="9" fill="#7c3aed"/><text x="1116" y="517" fill="#fff">NRST</text>
    </g>
  </g>

  <rect x="70" y="660" width="1360" height="64" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="96" y="699" fill="#991b1b" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700">安全提示：3.3V 不是 5V；NRST 可选；不同板子的 SWD 引脚位置不同，务必以原理图为准。</text>
</svg>
